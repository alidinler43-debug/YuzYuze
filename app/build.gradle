plugins {
    id 'com.android.application'
}

def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.alidinler.yuzyuze'
    compileSdk 34

    defaultConfig {
        applicationId "com.alidinler.yuzyuze"
        minSdk 26
        targetSdk 33
        versionCode runNo
        versionName "1." + runNo
    }

    signingConfigs {
        release {
            storeFile file('../keystore/yuzyuze.jks')
            storePassword 'yuzyuze2026'
            keyAlias 'yuzyuze'
            keyPassword 'yuzyuze2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "YuzYuze.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
